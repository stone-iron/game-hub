spring.application.name=game-hub
server.port=8090

# 화면에 바로 보여줄 수 있도록 서버 오류 메시지는 API 응답(ApiExceptionHandler)에서만 다룬다.
server.error.include-message=never

# 회원 DB: 별도 설치 없이 프로젝트 폴더의 data/ 에 저장되는 H2 파일 DB
# MySQL로 바꿀 때 예시:
#   spring.datasource.url=jdbc:mysql://localhost:3306/gamehub
#   spring.datasource.username=root
#   spring.datasource.password=비밀번호
spring.datasource.url=jdbc:h2:file:./data/gamehub;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 소셜 로그인: 값이 있는 제공자만 로그인 화면에 표시됩니다.
# 콜백 URI: http://localhost:8090/login/oauth2/code/{google|kakao|naver}
social.google.client-id=${GOOGLE_CLIENT_ID:}
social.google.client-secret=${GOOGLE_CLIENT_SECRET:}
social.kakao.client-id=${KAKAO_CLIENT_ID:}
social.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
social.naver.client-id=${NAVER_CLIENT_ID:}
social.naver.client-secret=${NAVER_CLIENT_SECRET:}
